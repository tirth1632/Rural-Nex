<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>RuralNex - Empowering Rural Dreams</title>
    <!-- Modern Professional Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ruralnex_theme');
          var userSettings = localStorage.getItem('ruralnex_user_settings');
          var theme = saved;
          if (!theme && userSettings) {
            try { theme = JSON.parse(userSettings).theme; } catch(e){}
          }
          if (theme === 'Dark' || theme === 'OLED') {
            document.documentElement.classList.add('dark', 'theme-dark');
            document.documentElement.classList.remove('theme-light');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark', 'theme-dark', 'theme-oled');
            document.documentElement.classList.add('theme-light');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (err) {}
      })();
    </script>
  </head>
  <body class="font-sans antialiased">
    <div id="root">
      <div id="app-preloader" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b0d11;color:#ffffff;font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;z-index:99999;">
        <style>
          @keyframes preloader-pulse {
            0%, 100% { transform: scale(0.96); filter: drop-shadow(0 0 14px rgba(16,185,129,0.4)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 28px rgba(20,184,166,0.7)); }
          }
          @keyframes preloader-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
        </style>
        <div style="position:relative;width:112px;height:112px;display:flex;align-items:center;justify-content:center;margin-bottom:18px;">
          <!-- Spinning orbital neon ring -->
          <div style="position:absolute;inset:0;border-radius:50%;border:2.5px solid transparent;border-top-color:#10b981;border-right-color:#14b8a6;animation:preloader-spin 1.8s linear infinite;"></div>
          <!-- Center emblem disc with new tree logo mark -->
          <div style="width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,0.05);border:1.5px solid rgba(16,185,129,0.35);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,0.6);">
            <img src="/logo.png" width="56" height="56" alt="RuralNex Logo" style="width:56px;height:56px;object-fit:contain;animation:preloader-pulse 2.2s ease-in-out infinite;" />
          </div>
        </div>
        <div style="font-size:18px;font-weight:900;letter-spacing:-0.02em;background:linear-gradient(to right,#34d399,#2dd4bf);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">RuralNex</div>
        <div style="font-size:12px;color:#9ca3af;margin-top:4px;">Empowering Rural Dreams...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
